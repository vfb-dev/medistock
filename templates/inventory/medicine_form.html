{% extends "base.html" %}

{% block title %}{% if medicine %}Edit{% else %}Add{% endif %} Medicine - MediStock{% endblock %}

{% block content %}
    <h1>{% if medicine %}Edit Medicine{% else %}Add Medicine{% endif %}</h1>

    <div class="form-box">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if medicine %}Update Medicine{% else %}Save Medicine{% endif %}</button>
            <a href="/medicines/" style="margin-left: 12px;">Cancel</a>
        </form>
    </div>
{% endblock %}
