<!DOCTYPE html>
<html>
<head>
    <title>{% if medicine %}Edit{% else %}Add{% endif %} Medicine - MediStock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }

        .form-box {
            background: white;
            padding: 24px;
            border-radius: 8px;
            max-width: 520px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 16px;
            background: #0f766e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
            margin-left: 12px;
        }

        .errorlist {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <h1>{% if medicine %}Edit Medicine{% else %}Add Medicine{% endif %}</h1>

    <div class="form-box">
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">{% if medicine %}Update Medicine{% else %}Save Medicine{% endif %}</button>
            <a href="/medicines/">Cancel</a>
        </form>
    </div>
</body>
</html>
