<!DOCTYPE html>
<html>
<head>
    <title>Delete Stock Movement - MediStock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }

        .box {
            background: white;
            padding: 24px;
            border-radius: 8px;
            max-width: 520px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .warning {
            color: #b91c1c;
            font-weight: bold;
        }

        button {
            margin-top: 16px;
            padding: 10px 16px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
            margin-left: 12px;
        }
    </style>
</head>
<body>
    <h1>Delete Stock Movement</h1>

    <div class="box">
        <p class="warning">This action cannot be undone.</p>

        <p>Are you sure you want to delete this movement?</p>

        <h2>{{ movement.get_movement_type_display }} - {{ movement.medicine.name }} - {{ movement.quantity }}</h2>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="/movements/">Cancel</a>
        </form>
    </div>
</body>
</html>
