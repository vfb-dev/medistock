{% extends "base.html" %}

{% block title %}{% if batch %}Edit{% else %}Add{% endif %} Stock Batch - MediStock{% endblock %}

{% block content %}
    <h1>{% if batch %}Edit Stock Batch{% else %}Add Stock Batch{% endif %}</h1>

    <div class="form-box">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if batch %}Update Batch{% else %}Save Batch{% endif %}</button>
            <a href="/batches/" style="margin-left: 12px;">Cancel</a>
        </form>
    </div>
{% endblock %}
