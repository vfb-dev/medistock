{% extends "base.html" %}

{% block title %}Delete Medicine - MediStock{% endblock %}

{% block content %}
    <h1>Delete Medicine</h1>

    <div class="box">
        <p class="warning">This action cannot be undone.</p>
        <p>Are you sure you want to delete:</p>
        <h2>{{ medicine.name }}</h2>
        <form method="post">
            {% csrf_token %}
            <button class="danger-button" type="submit">Yes, Delete</button>
            <a href="/medicines/" style="margin-left: 12px;">Cancel</a>
        </form>
    </div>
{% endblock %}
