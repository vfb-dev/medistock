{% extends "base.html" %}

{% block title %}Delete Stock Batch - MediStock{% endblock %}

{% block content %}
    <h1>Delete Stock Batch</h1>

    <div class="box">
        <p class="warning">This action cannot be undone.</p>
        <p>Are you sure you want to delete this batch?</p>
        <h2>{{ batch.medicine.name }} - {{ batch.batch_number }}</h2>
        <form method="post">
            {% csrf_token %}
            <button class="danger-button" type="submit">Yes, Delete</button>
            <a href="/batches/" style="margin-left: 12px;">Cancel</a>
        </form>
    </div>
{% endblock %}
