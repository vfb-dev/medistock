{% extends "base.html" %}

{% block title %}{% if movement %}Edit{% else %}Add{% endif %} Stock Movement - MediStock{% endblock %}

{% block content %}
    <h1>{% if movement %}Edit Stock Movement{% else %}Add Stock Movement{% endif %}</h1>

    <div class="form-box">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if movement %}Update Movement{% else %}Save Movement{% endif %}</button>
            <a href="/movements/" style="margin-left: 12px;">Cancel</a>
        </form>
    </div>
{% endblock %}
