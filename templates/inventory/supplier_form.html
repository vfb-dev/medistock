{% extends "base.html" %}

{% block title %}{% if supplier %}Edit{% else %}Add{% endif %} Supplier - MediStock{% endblock %}

{% block content %}
    <h1>{% if supplier %}Edit Supplier{% else %}Add Supplier{% endif %}</h1>

    <div class="form-box">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if supplier %}Update Supplier{% else %}Save Supplier{% endif %}</button>
            <a href="/suppliers/" style="margin-left: 12px;">Cancel</a>
        </form>
    </div>
{% endblock %}
